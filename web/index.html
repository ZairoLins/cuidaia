<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <script>
    // "cuidaia-41f74.web.app." (com ponto final, comum ao copiar um link de uma
    // frase) é outro domínio para o login do Google e para o App Check.
    if (location.hostname.endsWith('.')) {
      location.replace(location.href.replace(location.hostname, location.hostname.replace(/\.+$/, '')));
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Entenda o SUS e saiba onde ser atendido, em linguagem simples.">
  <meta name="theme-color" content="#137567">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CuidaIA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CuidaIA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #F7F8F8; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
                  justify-content: center; gap: 14px; font: 700 15px/1.4 system-ui, sans-serif; color: #4F5D68; }
    #carregando img { width: 72px; height: 72px; border-radius: 16px; }
  </style>
</head>
<body>
  <!-- Aparece enquanto o app carrega (alguns segundos na primeira visita). -->
  <div id="carregando" role="status">
    <img src="icons/Icon-192.png" alt="">
    <span>Carregando o CuidaIA…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
